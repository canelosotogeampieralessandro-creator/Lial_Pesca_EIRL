      const sync = S.sync, ui = S.ui, cfg = S.cfg, sesion = S.sesion;
      S = vacio();
      S.sync = sync; S.ui = ui; S.cfg = cfg; S.sesion = sesion;
      S.ui.vista = "panel"; S.ui.coCont = "TODAS";
      S.ui.fCompras = "todas"; S.ui.fVentas = "todas"; S.ui.fCont = "todas";
      asegurarEmpresas(S);
      guardar(); pintar(); cerrar();
      aviso("La app quedó como recién instalada.");
    }));
}

function shNube(){
  const c = S.sync.config;
  hoja({
    titulo:"Sincronizar con la nube",
    cuerpo:'<div class="stack">' +
      '<p class="muted">Sin configurar, la app funciona igual pero los datos viven solo en este equipo. ' +
      'Con la nube conectada, tú registras en el muelle aunque no haya señal y el contador ve lo mismo desde su computadora en cuanto vuelve la cobertura.</p>' +
      '<div class="card card-p"><b style="font-size:var(--t-sm)">Qué tienes que hacer una sola vez</b>' +
        '<ol class="muted" style="margin:8px 0 0;padding-left:18px;line-height:1.7">' +
          '<li>Entra a <b>console.firebase.google.com</b> y crea un proyecto (es gratis).</li>' +
          '<li>Crea una base de datos <b>Firestore</b>.</li>' +
          '<li>En Configuración del proyecto, registra una app <b>Web</b> y copia el bloque <b>firebaseConfig</b>.</li>' +
          '<li>Pégalo aquí abajo y elige un nombre de espacio compartido.</li>' +
          '<li>Ese mismo nombre y esa misma configuración se ponen en el celular del contador.</li>' +
        '</ol>' +
        '<p class="muted" style="margin-top:9px">Las reglas de seguridad que debes pegar en Firestore están en el README del repositorio.</p></div>' +
      '<div class="field"><label for="nbW">Nombre del espacio compartido</label>' +
        '<input id="nbW" placeholder="grupo-pesca" value="' + esc(S.sync.workspace||"") + '">' +
        '<span class="hint">Cualquier texto, sin espacios. Debe ser idéntico en todos los equipos.</span></div>' +
      '<div class="field"><label for="nbC">Configuración de Firebase</label>' +
        '<textarea id="nbC" rows="8" placeholder=\'{ "apiKey": "...", "projectId": "...", ... }\'>' +
        esc(c ? JSON.stringify(c,null,2) : "") + '</textarea>' +
        '<span class="hint">Pega el objeto completo. Estas claves son públicas por diseño: lo que protege los datos son las reglas de Firestore.</span></div>' +
    '</div>',
    pie:'<div class="btn-row">' + (c ? '<button class="btn btn-dgr btn-sm" style="flex:0 0 auto" id="nbX">Desconectar</button>' : '') +
        '<button class="btn btn-pri btn-lg" id="nbS">Conectar</button></div>'
  });
  $("nbS").addEventListener("click", () => {
    const w = $("nbW").value.trim().replace(/\s+/g,"-");
    const t = $("nbC").value.trim();
    if(!w) return aviso("Ponle un nombre al espacio compartido.");
    let cfg;
    try{
      cfg = JSON.parse(t.replace(/^[^{]*/,"").replace(/;?\s*$/,"")
              .replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"'));
    }catch(e){ return aviso("No pude leer esa configuración. Copia el bloque completo, con llaves."); }
    if(!cfg.projectId || !cfg.apiKey) return aviso("Falta apiKey o projectId en la configuración.");
    S.sync = {proveedor:"firebase", config:cfg, workspace:w};
    guardar(); cerrar(); aviso("Conectando…");
    Sync.iniciar();
  });
  const x = $("nbX");
  if(x) x.addEventListener("click", () => confirmar("¿Desconectar la nube?",
    "Los datos siguen en este equipo, pero dejan de compartirse con los demás.", () => {
      S.sync = {proveedor:null, config:null, workspace:""};
      Sync.estado = "local"; Sync.db = null;
      guardar(); pintar(); cerrar(); aviso("Nube desconectada.");
    }));
}

/* ------------------------------------------------------------
   AVISO DE VERSION NUEVA
   El navegador guarda la pagina en cache y puede seguir mostrando
   una version vieja despues de publicar. Esto lo detecta y lo avisa,
   sin recargar solo: recargar a media liquidacion perderia lo escrito.
   ------------------------------------------------------------ */
const VERSION = "2026.11.13-4";
async function verVersion(){
  try{
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"});
    if(!r.ok) return;
    const d = await r.json();
    if(d.v && d.v !== VERSION) document.getElementById("upd").classList.add("on");
  }catch(e){ /* sin señal: no pasa nada, la app sigue igual */ }
}
document.getElementById("updB").addEventListener("click", () => location.reload(true));
window.addEventListener("online", verVersion);
document.addEventListener("visibilitychange", () => { if(!document.hidden) verVersion(); });

if(empresasNuevas) guardar();
pintar();
Sync.iniciar();
verVersion();
if(empresasNuevas && !S.migrado){
  setTimeout(() => aviso(empresasNuevas === 1
    ? "Se agregó una empresa del grupo."
    : "Se agregaron las " + empresasNuevas + " empresas del grupo."), 600);
}
if(S.migrado){
  delete S.migrado; guardar();
  setTimeout(() => aviso("Tus datos de LIALPESCA se migraron al nuevo sistema."), 700);
}
