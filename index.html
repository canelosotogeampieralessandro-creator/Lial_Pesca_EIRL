<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Gestión de Cuentas — Grupo</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cuentas por pagar y por cobrar del grupo: liquidaciones enlazadas a facturas de venta, factoring, fletes y cierre contable.">
<meta name="theme-color" content="#05715E" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1416" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icono.png">
<link rel="manifest" href="manifest.json">
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* neutros con sesgo verde-frio, derivados del acento */
  --bg:#F3F6F6;
  --panel:#FFFFFF;
  --rail:#EAEFEF;
  --sunk:#F7F9F9;
  --line:#DBE3E3;
  --line-soft:#E7ECEC;
  --ink:#0E1A1D;
  --ink-2:#48595D;
  --ink-3:#5E7175;

  --accent:#05715E;
  --accent-ink:#FFFFFF;
  --accent-weak:#E2EEEB;
  --accent-line:#B9D7D0;

  --warn:#8E5A0E;
  --warn-weak:#F6EDDB;
  --warn-line:#E2CFA6;

  --danger:#9E3326;
  --danger-weak:#F7E5E2;
  --danger-line:#E6C3BC;

  --info:#28496B;
  --info-weak:#E4EAF1;
  --info-line:#C2D0E0;

  /* identidad de empresa: solo como marca, nunca como superficie */
  --co-1:#05715E;
  --co-2:#3B4F8C;
  --co-3:#95582C;
  --co-4:#773D61; --tile-ink:#FFFFFF;

  --sh-1:0 1px 2px rgba(14,26,29,.07), 0 1px 1px rgba(14,26,29,.04);
  --sh-2:0 2px 4px rgba(14,26,29,.06), 0 10px 26px rgba(14,26,29,.08);
  --sh-pop:0 10px 20px rgba(14,26,29,.10), 0 28px 56px rgba(14,26,29,.18);

  --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;

  /* escala fija, razon ~1.15 */
  --t-micro:.6875rem;  /* 11   */
  --t-xs:.78125rem;    /* 12.5 */
  --t-sm:.875rem;      /* 14   */
  --t-md:.9375rem;     /* 15   */
  --t-lg:1.0625rem;    /* 17   */
  --t-xl:1.25rem;      /* 20   */
  --t-2xl:1.5rem;      /* 24   */

  --r-ctl:8px;
  --r-card:10px;
  --r-chip:6px;
  --rail-w:252px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1416; --panel:#131F22; --rail:#101A1D; --sunk:#0E181B;
    --line:#243437; --line-soft:#1C2A2D;
    --ink:#E6EDEE; --ink-2:#A2B4B7; --ink-3:#93A6AA;
    --accent:#3DB69B; --accent-ink:#06211C; --accent-weak:#10312B; --accent-line:#1E4F45;
    --warn:#D69B4C; --warn-weak:#2E2411; --warn-line:#4A3A1B;
    --danger:#DC8071; --danger-weak:#331813; --danger-line:#53271F;
    --info:#7DA4CC; --info-weak:#15263A; --info-line:#243D59;
    --co-1:#3DB69B; --co-2:#7D90D4; --co-3:#D1945E; --co-4:#C07FA5; --tile-ink:#0B1416;
    --sh-1:0 1px 2px rgba(0,0,0,.45), 0 1px 1px rgba(0,0,0,.3);
    --sh-2:0 2px 4px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45);
    --sh-pop:0 10px 20px rgba(0,0,0,.5), 0 28px 56px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1416; --panel:#131F22; --rail:#101A1D; --sunk:#0E181B;
  --line:#243437; --line-soft:#1C2A2D;
  --ink:#E6EDEE; --ink-2:#A2B4B7; --ink-3:#93A6AA;
  --accent:#3DB69B; --accent-ink:#06211C; --accent-weak:#10312B; --accent-line:#1E4F45;
  --warn:#D69B4C; --warn-weak:#2E2411; --warn-line:#4A3A1B;
  --danger:#DC8071; --danger-weak:#331813; --danger-line:#53271F;
  --info:#7DA4CC; --info-weak:#15263A; --info-line:#243D59;
  --co-1:#3DB69B; --co-2:#7D90D4; --co-3:#D1945E; --co-4:#C07FA5; --tile-ink:#0B1416;
  --sh-1:0 1px 2px rgba(0,0,0,.45), 0 1px 1px rgba(0,0,0,.3);
  --sh-2:0 2px 4px rgba(0,0,0,.4), 0 10px 26px rgba(0,0,0,.45);
  --sh-pop:0 10px 20px rgba(0,0,0,.5), 0 28px 56px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --bg:#F3F6F6; --panel:#FFFFFF; --rail:#EAEFEF; --sunk:#F7F9F9;
  --line:#DBE3E3; --line-soft:#E7ECEC;
  --ink:#0E1A1D; --ink-2:#48595D; --ink-3:#5E7175;
  --accent:#05715E; --accent-ink:#FFFFFF; --accent-weak:#E2EEEB; --accent-line:#B9D7D0;
  --warn:#8E5A0E; --warn-weak:#F6EDDB; --warn-line:#E2CFA6;
  --danger:#9E3326; --danger-weak:#F7E5E2; --danger-line:#E6C3BC;
  --info:#28496B; --info-weak:#E4EAF1; --info-line:#C2D0E0;
  --co-1:#05715E; --co-2:#3B4F8C; --co-3:#95582C; --co-4:#773D61; --tile-ink:#FFFFFF;
}

/* ============================================================
   BASE  ·  incluye las superficies que dibuja el navegador
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:var(--t-md); line-height:1.45;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  caret-color:var(--accent);
}
::selection{background:var(--accent); color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
*{scrollbar-width:thin; scrollbar-color:var(--line) transparent}
*::-webkit-scrollbar{width:10px; height:10px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px; border:3px solid transparent; background-clip:content-box}
*::-webkit-scrollbar-thumb:hover{background:var(--ink-3); background-clip:content-box}
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.015em; font-weight:650}
p{margin:0}
button{font:inherit; color:inherit}
svg{display:block; flex:none}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
/* ============================================================
   ARMAZON  ·  responsive estructural, no tipografia fluida
   ============================================================ */
.shell{min-height:100dvh}
.rail{display:none}
.main{min-width:0}
.topbar{
  position:sticky; top:0; z-index:30; background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:calc(9px + env(safe-area-inset-top)) 16px 9px;
  display:flex; align-items:center; gap:10px;
}
.topbar h1{font-size:var(--t-lg); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.view{padding:16px 16px 28px; max-width:1180px}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}

.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--panel); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
  display:grid; grid-template-columns:repeat(6,1fr);
}
.tabs button{
  appearance:none; border:0; background:none; cursor:pointer;
  padding:8px 2px 9px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--ink-3); font-size:10px; font-weight:600; letter-spacing:.01em;
  border-top:2px solid transparent; margin-top:-1px; transition:color .15s ease;
}
.tabs button[aria-current="page"]{color:var(--accent); border-top-color:var(--accent)}

@media (min-width:1024px){
  body{padding-bottom:0}
  .shell{display:grid; grid-template-columns:var(--rail-w) 1fr; align-items:start}
  .rail{
    display:flex; flex-direction:column; gap:2px;
    position:sticky; top:0; height:100dvh; overflow-y:auto;
    background:var(--rail); border-right:1px solid var(--line); padding:14px 12px 12px;
  }
  .tabs{display:none}
  .topbar{padding:14px 28px; gap:14px}
  .topbar h1{font-size:var(--t-xl)}
  .view{padding:22px 28px 48px}
}
@media (min-width:1420px){ .view{padding-left:40px; padding-right:40px} }

/* marca y navegacion del rail */
.brand{display:flex; align-items:center; gap:9px; padding:4px 8px 12px}
.brand-mk{width:26px; height:26px; border-radius:7px; background:var(--accent); display:grid; place-items:center; flex:none}
.brand-tx{font-size:var(--t-sm); font-weight:650; letter-spacing:-.01em; line-height:1.15}
.brand-tx small{display:block; font-size:10px; font-weight:600; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase}
.navgrp{margin-top:10px; padding:0 8px 5px; font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.navitem{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:7px 9px; border-radius:var(--r-ctl); border:1px solid transparent;
  background:none; cursor:pointer; color:var(--ink-2); font-size:var(--t-sm); font-weight:550;
  transition:background .15s ease, color .15s ease;
}
.navitem:hover{background:var(--panel); color:var(--ink)}
.navitem[aria-current="page"]{background:var(--panel); border-color:var(--line); color:var(--ink); font-weight:650; box-shadow:var(--sh-1)}
.navitem[aria-current="page"] svg{color:var(--accent)}
.navitem .cnt{margin-left:auto; font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; color:var(--ink-3)}
.navitem[aria-current="page"] .cnt{color:var(--ink-2)}
.railfoot{margin-top:auto; padding-top:10px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:2px}

/* ============================================================
   CONTROLES
   ============================================================ */
.btn{
  appearance:none; cursor:pointer; font-family:var(--sans); font-size:var(--t-sm); font-weight:600;
  padding:10px 14px; border-radius:var(--r-ctl); border:1px solid transparent;
  display:inline-flex; align-items:center; justify-content:center; gap:7px; line-height:1.2;
  transition:background .15s ease, border-color .15s ease, opacity .15s ease;
}
.btn-pri{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-pri:hover{background:color-mix(in srgb, var(--accent) 88%, var(--ink))}
.btn-sec{background:var(--panel); color:var(--ink); border-color:var(--line)}
.btn-sec:hover{background:var(--sunk); border-color:var(--ink-3)}
.btn-ghost{background:transparent; color:var(--ink-2); border-color:transparent}
.btn-ghost:hover{background:var(--sunk); color:var(--ink)}
.btn-dgr{background:var(--panel); color:var(--danger); border-color:var(--danger-line)}
.btn-dgr:hover{background:var(--danger-weak)}
.btn:active{transform:translateY(.5px)}
.btn:disabled{opacity:.42; cursor:not-allowed; transform:none}
.btn-lg{padding:13px 18px; font-size:var(--t-md)}
.btn-sm{padding:7px 11px; font-size:var(--t-xs)}
.btn-full{width:100%}
.btn-row{display:flex; gap:8px; flex-wrap:wrap}
.btn-row>.btn{flex:1 1 auto}

.iconbtn{
  appearance:none; cursor:pointer; background:var(--panel); border:1px solid var(--line);
  color:var(--ink-2); width:36px; height:36px; border-radius:var(--r-ctl);
  display:grid; place-items:center; flex:none; transition:background .15s ease, color .15s ease;
}
.iconbtn:hover{background:var(--sunk); color:var(--ink)}

/* formularios */
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field>label{font-size:var(--t-micro); font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-3)}
.field .hint{font-size:var(--t-xs); color:var(--ink-3); line-height:1.4}
input,select,textarea{
  font-family:var(--sans); font-size:16px; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-ctl); padding:10px 11px; width:100%;
  appearance:none; transition:border-color .15s ease, box-shadow .15s ease;
}
@media (min-width:1024px){ input,select,textarea{font-size:var(--t-sm)} }
input[inputmode="decimal"],input[inputmode="numeric"]{font-family:var(--mono); font-variant-numeric:tabular-nums}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-weak)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:disabled,select:disabled{background:var(--sunk); color:var(--ink-3); cursor:not-allowed}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:32px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.grid3{display:grid; grid-template-columns:1fr; gap:11px}
@media (min-width:720px){ .grid3{grid-template-columns:repeat(3,1fr)} }
.check{display:flex; align-items:flex-start; gap:10px; cursor:pointer; padding:2px 0}
.check input{width:19px; height:19px; flex:none; margin-top:1px; accent-color:var(--accent)}
.check span{font-size:var(--t-sm); line-height:1.35}
.check small{display:block; color:var(--ink-3); font-size:var(--t-xs); margin-top:1px}
/* ============================================================
   SUPERFICIES
   ============================================================ */
.stack{display:flex; flex-direction:column; gap:12px}
.stack-lg{display:flex; flex-direction:column; gap:26px}
.sec{display:flex; flex-direction:column; gap:10px}
.sec-hd{display:flex; align-items:baseline; gap:10px; min-height:22px}
.sec-hd h2{font-size:var(--t-micro); font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
.sec-hd .sp{margin-left:auto}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--r-card); box-shadow:var(--sh-1)}
.card-p{padding:14px 15px}
.hr{height:1px; background:var(--line-soft); border:0; margin:0}
.muted{color:var(--ink-3); font-size:var(--t-xs); line-height:1.5}
.empty{text-align:center; padding:40px 20px; color:var(--ink-3); display:flex; flex-direction:column; align-items:center; gap:4px}
.empty svg{color:var(--line); margin-bottom:6px}
.empty b{color:var(--ink-2); font-size:var(--t-sm)}
.empty p{font-size:var(--t-xs); max-width:38ch}

/* ============================================================
   CIFRAS
   ============================================================ */
.figs{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; background:var(--panel); box-shadow:var(--sh-1)}
.figs > *{
  padding:12px 14px; border-right:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft);
  border-top:0; border-left:0; background:none; text-align:left;
  display:flex; flex-direction:column; gap:3px; min-width:0;
}
.figs > button{cursor:pointer; transition:background .15s ease}
.figs > button:hover{background:var(--sunk)}
.figs > *:nth-child(2n){border-right:0}
.figs > *:nth-last-child(-n+2){border-bottom:0}
@media (min-width:760px){
  .figs-4{grid-template-columns:repeat(4,1fr)}
  .figs-4 > *{border-bottom:0; border-right:1px solid var(--line-soft)}
  .figs-4 > *:last-child{border-right:0}
}
.fig-k{font-size:var(--t-micro); font-weight:650; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); display:flex; align-items:center; gap:5px}
.fig-v{font-family:var(--mono); font-size:var(--t-xl); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.03em; line-height:1.15}
.fig-n{font-size:var(--t-xs); color:var(--ink-3); line-height:1.3}
.v-acc{color:var(--accent)}
.v-warn{color:var(--warn)}
.v-dgr{color:var(--danger)}
.v-info{color:var(--info)}

/* linea de datos */
.dl{display:flex; flex-direction:column; gap:8px}
.dl .r{display:flex; justify-content:space-between; align-items:baseline; gap:14px; font-size:var(--t-sm)}
.dl .r > span{color:var(--ink-2); min-width:0}
.dl .r > span small{display:block; font-size:var(--t-xs); color:var(--ink-3)}
.dl .r > b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:600; text-align:right; white-space:nowrap}
.dl .r.tot{padding-top:8px; border-top:1px solid var(--line)}
.dl .r.tot > span{color:var(--ink); font-weight:650}
.dl .r.tot > b{font-size:var(--t-lg); color:var(--accent)}

/* ============================================================
   ESTADO
   ============================================================ */
.chip{
  display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase; padding:3px 7px 3px 6px; border-radius:var(--r-chip);
  white-space:nowrap; border:1px solid transparent; line-height:1.4;
}
.chip i{width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}
.c-ok{background:var(--accent-weak); color:var(--accent); border-color:var(--accent-line)}
.c-warn{background:var(--warn-weak); color:var(--warn); border-color:var(--warn-line)}
.c-dgr{background:var(--danger-weak); color:var(--danger); border-color:var(--danger-line)}
.c-info{background:var(--info-weak); color:var(--info); border-color:var(--info-line)}
.c-neu{background:var(--sunk); color:var(--ink-3); border-color:var(--line)}

/* marca de empresa */
.codot{width:8px; height:8px; border-radius:2px; flex:none}
.cotile{width:26px; height:26px; border-radius:7px; flex:none; display:grid; place-items:center; font-size:11px; font-weight:700; letter-spacing:-.02em; color:var(--tile-ink)}

/* ============================================================
   REGISTRO
   ============================================================ */
.rec{
  display:block; width:100%; text-align:left; cursor:pointer; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-card); padding:11px 13px;
  box-shadow:var(--sh-1); font-family:var(--sans); font-size:var(--t-md); color:var(--ink);
  transition:border-color .15s ease, background .15s ease;
}
.rec:hover{border-color:var(--ink-3); background:var(--sunk)}
.rec-t{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:3px}
.rec-id{font-family:var(--mono); font-size:var(--t-xs); font-weight:700; letter-spacing:-.02em}
.rec-d{margin-left:auto; font-family:var(--mono); font-size:var(--t-xs); color:var(--ink-3); font-variant-numeric:tabular-nums}
.rec-s{font-size:var(--t-sm); color:var(--ink-2); line-height:1.3; margin-bottom:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rec-f{display:flex; align-items:baseline; gap:16px; flex-wrap:wrap}
.rec-f .k{font-size:10px; font-weight:650; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-3); display:block}
.rec-f .v{font-family:var(--mono); font-size:var(--t-sm); font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.rec-f .big .v{font-size:var(--t-lg); font-weight:650}

/* ============================================================
   TABLA
   ============================================================ */
.tw{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-card); background:var(--panel); box-shadow:var(--sh-1)}
table{border-collapse:collapse; width:100%; font-size:var(--t-sm)}
thead th{
  position:sticky; top:0; background:var(--sunk); z-index:1;
  font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  text-align:left; padding:9px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:9px 12px; border-bottom:1px solid var(--line-soft); vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .12s ease}
tbody tr:hover{background:var(--sunk)}
td.n, th.n, tfoot td.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; letter-spacing:-.02em; white-space:nowrap}
tfoot td{padding:10px 12px; border-top:1px solid var(--line); font-weight:650; background:var(--sunk)}
.t-id{font-family:var(--mono); font-size:var(--t-xs); font-weight:650}
.t-co{display:flex; align-items:center; gap:7px; white-space:nowrap}

/* filtros */
.filters{display:flex; gap:7px; overflow-x:auto; padding-bottom:2px}
.filters button{
  appearance:none; cursor:pointer; flex:none; font-family:var(--sans); font-size:var(--t-xs); font-weight:600;
  padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink-2);

}

/* ============================================================
   SELECTOR DE LOTES
   ============================================================ */
.pick{border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; background:var(--panel)}

.pick-h{

  transition:background .15s ease;
}
.pick-h:hover{background:var(--sunk)}
.pick-i.on .pick-h{background:var(--accent-weak)}
.box{width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line); flex:none; margin-top:2px; display:grid; place-items:center; color:transparent; background:var(--panel); transition:background .15s ease, border-color .15s ease}

.pick-b{padding:0 12px 11px 41px; display:flex; flex-direction:column; gap:8px; background:var(--accent-weak)}

/* ============================================================
   HOJA MODAL
   ============================================================ */
#scrim{position:fixed; inset:0; background:rgba(8,18,20,.55); z-index:60; opacity:0; pointer-events:none; transition:opacity .18s ease}
#scrim.on{opacity:1; pointer-events:auto}
#sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:70; background:var(--bg);
  border-radius:16px 16px 0 0; box-shadow:var(--sh-pop);
  max-height:94dvh; display:flex; flex-direction:column;
  transform:translateY(102%); transition:transform .22s cubic-bezier(.32,.72,0,1);
}
#sheet.on{transform:translateY(0)}
.sh-h{display:flex; align-items:center; gap:10px; padding:13px 16px 12px; border-bottom:1px solid var(--line); background:var(--panel); border-radius:16px 16px 0 0; flex:none}
.sh-h h3{font-size:var(--t-lg); flex:1; min-width:0}

   ============================================================ */
#toast{

#toast.on{opacity:1; transform:translate(-50%,0)}

/* aviso de version nueva publicada */
#upd{
  position:fixed; left:12px; right:12px; bottom:calc(76px + env(safe-area-inset-bottom)); z-index:88;

.sync.ok .led{background:var(--accent)}

/* barra de progreso */
.bar{height:5px; border-radius:3px; background:var(--line); overflow:hidden}

/* ============================================================

@media print{

<script>
"use strict";

/* ============================================================

  config:  '<circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.5a1.6 1.6 0 0 0 .32 1.77l.06.06a1.95 1.95 0 1 1-2.76 2.76l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-.97 1.47v.17a1.95 1.95 0 0 1-3.9 0v-.09a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.77.32l-.06.06a1.95 1.95 0 1 1-2.76-2.76l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-.97h-.17a1.95 1.95 0 0 1 0-3.9h.09a1.6 1.6 0 0 0 1.46-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a1.95 1.95 0 1 1 2.76-2.76l.06.06a1.6 1.6 0 0 0 1.77.32h.08A1.6 1.6 0 0 0 10.2 3.3v-.17a1.95 1.95 0 1 1 3.9 0v.09a1.6 1.6 0 0 0 .97 1.47 1.6 1.6 0 0 0 1.77-.32l.06-.06a1.95 1.95 0 1 1 2.76 2.76l-.06.06a1.6 1.6 0 0 0-.32 1.77v.08a1.6 1.6 0 0 0 1.47.97h.17a1.95 1.95 0 0 1 0 3.9h-.09a1.6 1.6 0 0 0-1.43.97z"/>',
  persona: '<circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/>',
  balanza: '<path d="M12 4v16M7 20h10"/><path d="M12 7 4 9l2.6 5.2a3.6 3.6 0 0 0 5.4-3.1zM12 7l8 2-2.6 5.2a3.6 3.6 0 0 1-5.4-3.1z"/>',
  ojo:     '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12"/><circle cx="12" cy="12" r="3"/>',
  nota:    '<path d="M5 3.5h14v17l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8.5h6M9 12.5h4"/>',
  volver:  '<path d="M19 12H5m0 0 6-6m-6 6 6 6"/>'
};
function ic(n, s){
  s = s || 18;
  return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
         'stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
         (PATHS[n] || '') + '</svg>';
}

/* ============================================================
   MODELO
   ============================================================ */
const KEY = "gestion_v2";
const KEY_V1 = "lialpesca_v1";
const MEDIOS = [
  {id:"BBVA",     nombre:"BBVA",      color:"#1464A5"},
  {id:"IBK",      nombre:"Interbank", color:"#00A44E"},
  {id:"EFECTIVO", nombre:"Efectivo",  color:"#8E5A0E"}
];
const HUES = ["var(--co-1)","var(--co-2)","var(--co-3)","var(--co-4)"];

/* Empresas del grupo. Razon social y RUC son registro publico de SUNAT,
   no datos personales de terceros, por eso si se versionan aqui.
   Se pueden editar desde la app; esta lista solo garantiza que existan. */
const EMPRESAS_FIJAS = [
  {id:"co_lial",    nombre:"LIALPESCA E.I.R.L.", ruc:"20616172051", hue:0},
  {id:"co_valpez",  nombre:"VALPEZ E.I.R.L.",    ruc:"20608281381", hue:1},
  {id:"co_valfish", nombre:"VALFISH E.I.R.L.",   ruc:"20607642011", hue:2}
];
const nuevaFija = e => ({id:e.id, nombre:e.nombre, ruc:e.ruc, hue:e.hue,
                         archivada:false, serieLiq:"E001", serieVen:"E001"});

/* Idempotente: agrega las que falten sin tocar las que ya existen ni
   duplicar las que el usuario haya renombrado. */
function asegurarEmpresas(st){
  if(!Array.isArray(st.empresas)) st.empresas = [];
  let agregadas = 0;
  EMPRESAS_FIJAS.forEach(f => {
    if(st.empresas.some(e => e.id === f.id || (e.ruc && e.ruc === f.ruc))) return;
    st.empresas.push(nuevaFija(f));
    agregadas++;
  });
  st.empresas.forEach(e => { if(!st.seq[e.id]) st.seq[e.id] = {liq:1, ven:1, fac:1, fle:1}; });
  if(!st.empresaActiva || !st.empresas.some(e => e.id === st.empresaActiva))
    st.empresaActiva = st.empresas.length ? st.empresas[0].id : null;
  return agregadas;
}

function vacio(){
  return {
    v:2,
    empresas:[], empresaActiva:null,
    sesion:{rol:"propietario", nombre:""},
    pescadores:[], clientes:[], transportistas:[], factores:[],
    liquidaciones:[], ventas:[], factorings:[], fletes:[],
    seq:{}, cfg:{retencion:1.5, detraccion:1.5},
    sync:{proveedor:null, config:null, workspace:""},
    ui:{vista:"panel", fCompras:"todas", fVentas:"todas", fCont:"todas", coCont:"TODAS"}
  };
}

/* --- migracion desde la version de una sola empresa --- */
function migrar(){
  let v1 = null;
  try{ v1 = JSON.parse(localStorage.getItem(KEY_V1)); }catch(e){}
  const S = vacio();
  if(!v1) return S;
  const id = "co_lial";
  ["pescadores","clientes","transportistas","factores"].forEach(k => { S[k] = v1[k] || []; });
  ["liquidaciones","ventas","factorings","fletes"].forEach(k => {
    S[k] = (v1[k] || []).map(r => Object.assign({}, r, {empresaId:id, rev:null}));
  });
  S.seq[id] = v1.seq || {liq:1, ven:1, fac:1, fle:1};
  if(v1.cfg){ S.cfg.retencion = v1.cfg.retencion ?? 1.5; S.cfg.detraccion = v1.cfg.detraccion ?? 1.5; }
  S.empresaActiva = id;
  S.migrado = true;
  S.serieHeredada = {liq:(v1.cfg && v1.cfg.serieLiq) || "E001", ven:(v1.cfg && v1.cfg.serieVen) || "E001"};
  return S;
}

let S;
try{
  const raw = localStorage.getItem(KEY);
  S = raw ? JSON.parse(raw) : migrar();
}catch(e){ S = vacio(); }
if(!S || S.v !== 2) S = vacio();
if(!S.ui) S.ui = vacio().ui;
if(!S.sesion) S.sesion = {rol:"propietario", nombre:""};
if(!S.sync) S.sync = {proveedor:null, config:null, workspace:""};
if(!S.seq) S.seq = {};
const empresasNuevas = asegurarEmpresas(S);
if(S.serieHeredada){
  const l = S.empresas.find(e => e.id === "co_lial");
  if(l){ l.serieLiq = S.serieHeredada.liq; l.serieVen = S.serieHeredada.ven; }
  delete S.serieHeredada;
}

function guardar(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ aviso("No se pudo guardar: el navegador no tiene espacio."); }
  Sync.marcar();
}
/* ============================================================
   UTILIDADES
   ============================================================ */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const r2 = v => Math.round((Number(v)||0)*100)/100;
const n2 = v => (Number(v)||0).toLocaleString("es-PE",{minimumFractionDigits:2, maximumFractionDigits:2});
const nk = v => (Number(v)||0).toLocaleString("es-PE",{maximumFractionDigits:2});
const sol = v => "S/ " + n2(v);
const hoy = () => new Date().toISOString().slice(0,10);
const fch = iso => { if(!iso) return "—"; const p = String(iso).split("-"); return p[2]+"/"+p[1]+"/"+p[0]; };
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const x = parseFloat(String(v).replace(",",".")); return isFinite(x) ? x : 0; };

const cat = (t,id) => (S[t]||[]).find(x => x.id===id) || {nombre:"—", doc:""};
const emp = id => S.empresas.find(e => e.id===id) || {nombre:"—", ruc:"", hue:0};
const hue = id => HUES[(emp(id).hue || 0) % 4];
const inic = id => (emp(id).nombre || "?").replace(/[^A-Za-zÁÉÍÓÚÑ ]/g,"").trim().slice(0,2).toUpperCase();
const medioN = id => (MEDIOS.find(m => m.id===id) || {nombre:id||"—"}).nombre;
const medioC = id => (MEDIOS.find(m => m.id===id) || {color:"#7A8C90"}).color;

const EA = () => S.empresaActiva;
const de = (coll, eid) => S[coll].filter(r => r.empresaId === (eid === undefined ? EA() : eid));
const todos = coll => S[coll];

function seqDe(eid){
  if(!S.seq[eid]) S.seq[eid] = {liq:1, ven:1, fac:1, fle:1};
  return S.seq[eid];
}

/* --- saldo de lote: kilos comprados menos kilos ya vendidos --- */
function kgVend(liqId){
  return S.ventas.reduce((t,v) => t + v.items.filter(i => i.liqId===liqId).reduce((s,i)=>s+i.kg,0), 0);
}
const saldo = l => r2(l.kg - kgVend(l.id));
function stockDe(l){
  const s = saldo(l);
  if(s <= .009) return "vendida";
  if(s < l.kg - .009) return "parcial";
  return "stock";
}

const vKg    = v => r2(v.items.reduce((t,i)=>t+i.kg,0));
const vCosto = v => r2(v.items.reduce((t,i)=>t+i.kg*i.costoUnit,0));
const vMargen= v => r2(v.total - vCosto(v));

const pagado = d => r2((d.pagos||[]).reduce((t,p)=>t+p.monto,0));
function estado(d, meta){
  if(d.factoringId) return "factoring";
  return pagado(d) >= meta - .009 ? "ok" : "pend";
}

/* --- revision del contador --- */
const revOf = d => (d.rev && d.rev.estado) || "sin";
const REV = {
  sin:      {t:"Sin revisar", c:"c-neu"},
  revisado: {t:"Revisado",    c:"c-ok"},
  observado:{t:"Observado",   c:"c-dgr"}
};

/* --- indice unico de movimientos, para la vista del contador --- */
function movimientos(filtroEmpresa){
  const out = [];
  const push = (tipo, coll, r, monto, meta, quien) => {
    if(filtroEmpresa && filtroEmpresa !== "TODAS" && r.empresaId !== filtroEmpresa) return;
    out.push({tipo, coll, id:r.id, empresaId:r.empresaId, numero:r.numero, fecha:r.fecha,
              monto, estado:estado(r, meta), rev:revOf(r), quien, ref:r});
  };
  S.liquidaciones.forEach(l => push("Liquidación","liquidaciones",l,l.neto,l.neto,cat("pescadores",l.pescadorId).nombre));
  S.ventas.forEach(v => push("Venta","ventas",v,v.total,v.netoCobrar,cat("clientes",v.clienteId).nombre));
  S.factorings.forEach(f => push("Factoring","factorings",f,f.neto,f.neto,cat("factores",f.factorId).nombre));
  S.fletes.forEach(f => push("Flete","fletes",f,f.monto,f.monto,cat("transportistas",f.transportistaId).nombre));
  return out.sort((a,b) => (b.fecha+b.numero).localeCompare(a.fecha+a.numero));
}

/* --- resumen por empresa --- */
function resumen(eid){
  const L = de("liquidaciones",eid), V = de("ventas",eid), F = de("factorings",eid), T = de("fletes",eid);
  const liqPend = L.filter(l => estado(l,l.neto)==="pend");
  const flePend = T.filter(f => estado(f,f.monto)==="pend");
  const venPend = V.filter(v => estado(v,v.netoCobrar)==="pend");
  const conSaldo = L.filter(l => saldo(l) > .009);
  const ventas = r2(V.reduce((t,v)=>t+v.total,0));
  const costo  = r2(V.reduce((t,v)=>t+vCosto(v),0));
  const fletes = r2(T.reduce((t,f)=>t+f.monto,0));
  const descF  = r2(F.reduce((t,f)=>t+f.descuento,0));
  return {
    eid,
    nDocs: L.length + V.length + F.length + T.length,
    porPagar:  r2(liqPend.reduce((t,l)=>t+l.neto-pagado(l),0) + flePend.reduce((t,f)=>t+f.monto-pagado(f),0)),
    porCobrar: r2(venPend.reduce((t,v)=>t+v.netoCobrar-pagado(v),0)),
    nPagar: liqPend.length + flePend.length,
    nCobrar: venPend.length,
    stockKg:  r2(conSaldo.reduce((t,l)=>t+saldo(l),0)),
    stockVal: r2(conSaldo.reduce((t,l)=>t+saldo(l)*l.valorUnit,0)),
    kgComprado: r2(L.reduce((t,l)=>t+l.kg,0)),
    kgVendido:  r2(V.reduce((t,v)=>t+vKg(v),0)),
    ventas, costo, fletes, descF,
    margen: r2(ventas-costo),
    neto:   r2(ventas-costo-fletes-descF),
    retencion: r2(L.reduce((t,l)=>t+l.retencion,0)),
    detraccion: r2(V.reduce((t,v)=>t+(v.detraccion||0),0)),
    sinRevisar: [...L,...V,...F,...T].filter(r => revOf(r)==="sin").length
  };
}

/* ============================================================
   SINCRONIZACION  ·  local primero; la nube es un espejo
   ============================================================ */
const Sync = {
  estado:"local", db:null, uid:null, pend:0,
  get activo(){ return !!(S.sync && S.sync.config && S.sync.workspace); },

  marcar(){
    if(!this.activo) return;
    this.pend++;
    clearTimeout(this._t);
    this._t = setTimeout(() => this.subir(), 900);
    this.pintar();
  },

  async iniciar(){
    if(!this.activo){ this.estado = "local"; this.pintar(); return; }
    this.estado = "conectando"; this.pintar();
    try{
      const [{initializeApp}, fs] = await Promise.all([
        import("https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js")
      ]);
      const app = initializeApp(S.sync.config, "gc-" + Date.now());
      this.fs = fs;
      this.db = fs.initializeFirestore(app, {
        localCache: fs.persistentLocalCache({tabManager: fs.persistentMultipleTabManager()})
      });
      this.ref = fs.doc(this.db, "espacios", S.sync.workspace);
      fs.onSnapshot(this.ref, {includeMetadataChanges:true}, snap => {
        this.estado = snap.metadata.fromCache ? "sin-senal" : "ok";
        const d = snap.data();
        if(d && d.datos && d.sello && d.sello !== this._sello){
          this.bajar(d);
        }
        this.pintar();
      }, err => { this.estado = "err"; this._msg = err.message; this.pintar(); });
    }catch(e){
      this.estado = "err"; this._msg = e.message; this.pintar();
    }
  },

  async subir(){
    if(!this.db || !this.ref) return;
    try{
      const sello = Date.now() + "-" + Math.random().toString(36).slice(2,6);
      this._sello = sello;
      const copia = JSON.parse(JSON.stringify(S));
      delete copia.sync; delete copia.ui;
      await this.fs.setDoc(this.ref, {sello, actualizado:new Date().toISOString(), datos:copia});
      this.pend = 0; this.pintar();
    }catch(e){ this.estado = "err"; this._msg = e.message; this.pintar(); }
  },

  bajar(d){
    this._sello = d.sello;
    const local = {sync:S.sync, ui:S.ui};
    S = Object.assign({}, d.datos, local);
    if(!S.seq) S.seq = {};
    asegurarEmpresas(S);
    try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    pintar();
    aviso("Datos actualizados desde la nube.");
  },

  pintar(){
    const b = document.getElementById("syncBtn");
    if(!b) return;
    const M = {
      local:      {c:"",    t:"Solo en este equipo", s:"Conectar la nube"},
      conectando: {c:"",    t:"Conectando…",         s:"Un momento"},
      ok:         {c:"ok",  t:"Sincronizado",        s:"Todos ven lo mismo"},
      "sin-senal":{c:"off", t:"Sin señal",           s:"Se enviará al reconectar"},
      err:        {c:"err", t:"Error de conexión",   s:this._msg || "Revisar configuración"}
    }[this.estado] || {c:"", t:"—", s:""};
    b.className = "sync " + M.c;
    b.innerHTML = '<span class="led"></span><span style="flex:1;min-width:0">' + esc(M.t) +
                  '<small>' + esc(M.s) + '</small></span>' +
                  (this.pend ? '<span class="num" style="font-size:10px;color:var(--ink-3)">' + this.pend + '</span>' : '');
  }
};

function shRevisar(ref){
  const [coll,id] = ref.split(":");
  const d = S[coll].find(x => x.id===id); if(!d) return;
  const r = d.rev || {};
  hoja({
    titulo:"Revisión contable", sub:d.numero + " · " + emp(d.empresaId).nombre,
    cuerpo:'<div class="stack">' +
      '<div class="field"><label>Estado</label>' +
        '<div class="opts">' +
          '<button class="opt" data-e="revisado"><span class="sw" style="background:var(--accent)"></span>' +
            '<span style="flex:1">Revisado<small style="display:block;font-weight:400;color:var(--ink-3);font-size:var(--t-xs)">Conforme, pasa al cierre</small></span></button>' +
          '<button class="opt" data-e="observado"><span class="sw" style="background:var(--danger)"></span>' +
            '<span style="flex:1">Observado<small style="display:block;font-weight:400;color:var(--ink-3);font-size:var(--t-xs)">Requiere corrección o sustento</small></span></button>' +
          '<button class="opt" data-e="sin"><span class="sw" style="background:var(--ink-3)"></span>' +
            '<span style="flex:1">Quitar la marca<small style="display:block;font-weight:400;color:var(--ink-3);font-size:var(--t-xs)">Vuelve a quedar sin revisar</small></span></button>' +
        '</div></div>' +
      '<div class="field"><label for="rvNota">Nota</label>' +
        '<textarea id="rvNota" rows="3" placeholder="Opcional: qué falta o qué observaste">' + esc(r.nota||"") + '</textarea></div>' +
      (r.fecha ? '<p class="muted">Última marca: ' + esc(REV[r.estado] ? REV[r.estado].t : r.estado) + ' el ' + fch(r.fecha) + (r.por ? ' por ' + esc(r.por) : '') + '</p>' : '') +
    '</div>'
  });
  $sheet.querySelectorAll("[data-e]").forEach(b => b.addEventListener("click", () => {
    const e = b.dataset.e;
    const nota = $("rvNota").value.trim();
    d.rev = e === "sin" ? null : {estado:e, nota, por:S.sesion.nombre || "Contador", fecha:hoy()};
    guardar(); pintar(); cerrar();
    aviso(e === "sin" ? "Marca retirada." : (e === "revisado" ? "Movimiento revisado." : "Movimiento observado."));
  }));
}
/* ============================================================

   ============================================================ */
function flujo(o){
  hoja({
    cerrable:false, titulo:"Registro completado",
    cuerpo:'<div class="done"><div class="mk">' + ic("check",24) + '</div>' +
      '<h4>' + esc(o.titulo) + '</h4><p>' + esc(o.detalle) + '</p>' +
      '<p class="q">' + esc(o.pregunta) + '</p></div>',
    pie:'<div class="btn-row"><button class="btn btn-sec btn-lg" id="fNo">' + esc(o.no) + '</button>' +
        '<button class="btn btn-pri btn-lg" id="fSi">' + esc(o.si) + '</button></div>'
  });
  $("fNo").addEventListener("click", () => {
    cerrar(); aviso(o.verbo==="cobro" ? "Queda registrada como POR COBRAR." : "Queda registrada como POR PAGAR.");
  });
  $("fSi").addEventListener("click", () => pedirMedio({
    monto:o.monto, verbo:o.verbo,
    ok:(medio,f) => { o.alPagar(medio,f); cerrar();
      aviso((o.verbo==="cobro"?"Cobro":"Pago") + " registrado · " + medioN(medio)); }
  }));
}

   FORMULARIO · LIQUIDACION DE COMPRA

function nuevaLiq(){
  if(!EA()) return aviso("Primero registra una empresa.");
  const e = emp(EA()), sq = seqDe(EA());
  hoja({
    titulo:"Nueva liquidación de compra", sub:e.nombre,
    cuerpo:'<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label for="lqN">N° liquidación</label>' +
          '<input id="lqN" value="' + esc((e.serieLiq||"E001") + "-" + sq.liq) + '"></div>' +
        '<div class="field"><label for="lqF">Fecha</label><input id="lqF" type="date" value="' + hoy() + '"></div>' +
      '</div>' +
      '<div class="field"><label for="lqP">Pescador</label><select id="lqP">' +
        S.pescadores.map(p => '<option value="' + p.id + '">' + esc(p.nombre) + (p.doc ? " · " + esc(p.doc) : "") + '</option>').join("") +
        '<option value="__n">+ Agregar pescador nuevo…</option></select></div>' +
      '<div id="lqNv" class="grid2" style="display:' + (S.pescadores.length?"none":"grid") + '">' +
        '<div class="field"><label for="lqNom">Nombre completo</label><input id="lqNom" autocapitalize="characters" placeholder="Nombre y apellidos"></div>' +
        '<div class="field"><label for="lqDni">DNI</label><input id="lqDni" inputmode="numeric" placeholder="00000000"></div>' +
      '</div>' +
      '<hr class="hr">' +
      '<div class="grid2">' +
        '<div class="field"><label for="lqKg">Kilos comprados</label><input id="lqKg" inputmode="decimal" placeholder="0" autocomplete="off"></div>' +
        '<div class="field"><label for="lqPu">Precio S/ por kg</label><input id="lqPu" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>' +
      '</div>' +
      '<div class="field"><label for="lqT">Total de la compra S/</label>' +
        '<input id="lqT" inputmode="decimal" placeholder="0.00" autocomplete="off">' +
        '<span class="hint">Escribe el precio por kilo <b>o</b> el total: lo que falte se calcula solo.</span></div>' +
      '<div class="card card-p"><div class="dl" id="lqC"></div></div>' +
    '</div>',
    pie:'<button class="btn btn-pri btn-lg btn-full" id="lqS">Registrar liquidación</button>'
  });

  $("lqP").addEventListener("change", () => { $("lqNv").style.display = $("lqP").value==="__n" ? "grid" : "none"; });

  function calc(src){
    const kg = num($("lqKg").value), pu = num($("lqPu").value), tt = num($("lqT").value);
    let total = tt;
    if(src !== "t" && kg > 0 && pu > 0){ total = r2(kg*pu); $("lqT").value = total ? total.toFixed(2) : ""; }
    else if(src === "t" && kg > 0 && tt > 0){ $("lqPu").value = (tt/kg).toFixed(6).replace(/0+$/,"").replace(/\.$/,""); }
    const ret = r2(total * S.cfg.retencion/100);
    $("lqC").innerHTML =
      '<div class="r"><span>Kilos × precio</span><b>' + nk(kg) + ' × ' + n2(num($("lqPu").value)) + '</b></div>' +
      '<div class="r"><span>Total valor de compra</span><b>' + sol(total) + '</b></div>' +
      '<div class="r"><span>Retención de IR ' + S.cfg.retencion + '%</span><b class="v-dgr">− ' + n2(ret) + '</b></div>' +
      '<div class="r tot"><span>Neto a pagar al pescador</span><b>' + sol(total-ret) + '</b></div>';
  }
  ["lqKg","lqPu"].forEach(id => $(id).addEventListener("input", () => calc("p")));
  $("lqT").addEventListener("input", () => calc("t"));
  calc();

  $("lqS").addEventListener("click", () => {
    const kg = num($("lqKg").value), total = num($("lqT").value);
    if(kg <= 0) return aviso("Ingresa los kilos comprados.");
    if(total <= 0) return aviso("Ingresa el precio por kilo o el total.");
    let pid = $("lqP").value;
    if(pid === "__n" || !S.pescadores.length){
      const nom = $("lqNom").value.trim();
      if(!nom) return aviso("Escribe el nombre del pescador.");
      pid = uid();
      S.pescadores.push({id:pid, nombre:nom.toUpperCase(), doc:$("lqDni").value.trim()});
    }
    const ret = r2(total * S.cfg.retencion/100);
    const l = {id:uid(), empresaId:EA(), numero:$("lqN").value.trim() || ((e.serieLiq||"E001")+"-"+sq.liq),
               fecha:$("lqF").value || hoy(), pescadorId:pid, kg:r2(kg), valorUnit:total/kg,
               total:r2(total), retencion:ret, neto:r2(total-ret), pagos:[], rev:null};
    S.liquidaciones.push(l); sq.liq++;
    guardar(); pintar();
    flujo({titulo:"Liquidación " + l.numero + " registrada", detalle:nk(l.kg) + " kg · " + cat("pescadores",pid).nombre,
           pregunta:"¿La compra se acaba de pagar?", si:"Sí, ya la pagué", no:"No, queda pendiente", monto:l.neto,
           alPagar:(m,f) => { l.pagos.push({fecha:f, medio:m, monto:l.neto}); guardar(); pintar(); }});
  });
}
/* ============================================================
   FORMULARIO · FACTURA DE VENTA
   ============================================================ */
let borr = {};

function nuevaVenta(){
  if(!EA()) return aviso("Primero registra una empresa.");
  const e = emp(EA()), sq = seqDe(EA());
  const disp = de("liquidaciones").filter(l => saldo(l) > .009)
                 .sort((a,b) => (a.fecha+a.numero).localeCompare(b.fecha+b.numero));
  if(!disp.length){
    return hoja({titulo:"No hay mercadería disponible",
      cuerpo:'<div class="done"><div class="mk w">' + ic("alerta",22) + '</div>' +
        '<h4>Todo lo comprado ya está vendido</h4>' +
        '<p>Registra una liquidación de compra en ' + esc(e.nombre) + ' antes de emitir una factura de venta.</p></div>',
      pie:'<button class="btn btn-sec btn-lg btn-full" data-x>Entendido</button>'});
  }
  borr = {sel:{}};

  hoja({
    titulo:"Nueva factura de venta", sub:e.nombre,
    cuerpo:'<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label for="vnN">N° factura</label>' +
          '<input id="vnN" value="' + esc((e.serieVen||"E001") + "-" + sq.ven) + '"></div>' +
        '<div class="field"><label for="vnF">Fecha</label><input id="vnF" type="date" value="' + hoy() + '"></div>' +
      '</div>' +
      '<div class="field"><label for="vnC">Comprador</label><select id="vnC">' +
        S.clientes.map(c => '<option value="' + c.id + '">' + esc(c.nombre) + '</option>').join("") +
        '<option value="__n">+ Agregar cliente nuevo…</option></select></div>' +
      '<div id="vnNv" class="grid2" style="display:' + (S.clientes.length?"none":"grid") + '">' +
        '<div class="field"><label for="vnNom">Razón social</label><input id="vnNom" autocapitalize="characters"></div>' +
        '<div class="field"><label for="vnRuc">RUC</label><input id="vnRuc" inputmode="numeric"></div>' +
      '</div>' +
      '<hr class="hr">' +
      '<div class="sec-hd"><h2>Liquidaciones que sustentan esta venta</h2></div>' +
      '<p class="muted">Solo aparecen las que tienen saldo. Puedes tomar el lote completo o una parte.</p>' +
      '<div class="pick" id="vnP"></div>' +
      '<hr class="hr">' +
      '<div class="grid2">' +
        '<div class="field"><label for="vnPu">Precio venta S/ por kg</label><input id="vnPu" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>' +
        '<div class="field"><label for="vnT">Importe total S/</label><input id="vnT" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>' +
      '</div>' +
      '<label class="check"><input type="checkbox" id="vnD" checked>' +
        '<span>Sujeta a detracción ' + S.cfg.detraccion + '%' +
        '<small>El cliente deposita ese monto en tu cuenta del Banco de la Nación; no te llega directo.</small></span></label>' +
      '<div class="card card-p"><div class="dl" id="vnC2"></div></div>' +
    '</div>',
    pie:'<button class="btn btn-pri btn-lg btn-full" id="vnS">Registrar venta</button>'
  });

  $("vnC").addEventListener("change", () => { $("vnNv").style.display = $("vnC").value==="__n" ? "grid" : "none"; });

  function fila(l){
    const on = borr.sel[l.id] != null, max = saldo(l), parcial = max < l.kg - .009;
    return '<div class="pick-i' + (on?" on":"") + '">' +
      '<button class="pick-h" data-p="' + l.id + '"><span class="box">' + ic("check",13) + '</span>' +
      '<span class="pick-m"><span class="pick-t">' + esc(l.numero) + '</span>' +
        '<span class="pick-s">' + esc(cat("pescadores",l.pescadorId).nombre) + '</span>' +
        '<span class="pick-q">' + nk(max) + ' kg disponibles' + (parcial ? " de " + nk(l.kg) : "") +
          ' · S/ ' + n2(l.valorUnit) + '/kg · ' + fch(l.fecha) + '</span></span></button>' +
      (on ? '<div class="pick-b">' +
        '<div class="field"><label for="k_' + l.id + '">Kilos a tomar de este lote</label>' +
          '<input id="k_' + l.id + '" data-k="' + l.id + '" inputmode="decimal" value="' + borr.sel[l.id] + '"></div>' +
        '<div class="qc">' + [25,50,75,100].map(p =>
          '<button type="button" data-pc="' + l.id + '|' + p + '">' + (p===100?"Todo":p+"%") + '</button>').join("") +
        '</div></div>' : '') +
    '</div>';
  }

  function enlazar(){
    $("vnP").querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.p;
      if(borr.sel[id] != null) delete borr.sel[id];
      else borr.sel[id] = saldo(S.liquidaciones.find(x=>x.id===id));
      repintar();
    }));
    $("vnP").querySelectorAll("[data-k]").forEach(i => i.addEventListener("input", () => {
      const id = i.dataset.k, max = saldo(S.liquidaciones.find(x=>x.id===id));
      let v = num(i.value);
      if(v > max){ v = max; i.value = max; aviso("El saldo de ese lote es " + nk(max) + " kg."); }
      borr.sel[id] = v; calc("p");
    }));
    $("vnP").querySelectorAll("[data-pc]").forEach(b => b.addEventListener("click", () => {
      const [id,pc] = b.dataset.pc.split("|");
      borr.sel[id] = r2(saldo(S.liquidaciones.find(x=>x.id===id)) * (+pc)/100);
      repintar();
    }));
  }
  function repintar(){ $("vnP").innerHTML = disp.map(fila).join(""); enlazar(); calc("p"); }

  function calc(src){
    const kg = r2(Object.values(borr.sel).reduce((t,v)=>t+(Number(v)||0),0));
    const pu = num($("vnPu").value), tt = num($("vnT").value);
    let total = tt;
    if(src !== "t"){ if(kg > 0 && pu > 0){ total = r2(kg*pu); $("vnT").value = total.toFixed(2); } }
    else if(kg > 0 && tt > 0){ $("vnPu").value = (tt/kg).toFixed(4).replace(/0+$/,"").replace(/\.$/,""); }
    const costo = r2(Object.entries(borr.sel).reduce((t,[id,k]) => {
      const l = S.liquidaciones.find(x=>x.id===id); return t + (Number(k)||0)*(l?l.valorUnit:0); },0));
    const det = $("vnD").checked ? r2(total * S.cfg.detraccion/100) : 0;
    const mg = r2(total - costo), pct = costo > 0 ? (mg/costo*100) : 0;
    $("vnC2").innerHTML =
      '<div class="r"><span>Lotes seleccionados</span><b>' + Object.keys(borr.sel).length + '</b></div>' +
      '<div class="r"><span>Kilos a vender</span><b>' + nk(kg) + ' kg</b></div>' +
      '<div class="r"><span>Importe de la factura</span><b>' + sol(total) + '</b></div>' +
      (det ? '<div class="r"><span>Detracción ' + S.cfg.detraccion + '%</span><b class="v-dgr">− ' + n2(det) + '</b></div>' : '') +
      '<div class="r tot"><span>Neto a cobrar del cliente</span><b>' + sol(total-det) + '</b></div>' +
      '<div class="r" style="margin-top:4px"><span>Costo de esos lotes</span><b>' + sol(costo) + '</b></div>' +
      '<div class="r tot"><span>Margen bruto</span><b class="' + (mg>=0?"v-acc":"v-dgr") + '">' + sol(mg) +
        ' · ' + (mg>=0?"+":"") + pct.toFixed(1) + '%</b></div>';
  }
  $("vnPu").addEventListener("input", () => calc("p"));
  $("vnT").addEventListener("input", () => calc("t"));
  $("vnD").addEventListener("change", () => calc("k"));
  repintar();

  $("vnS").addEventListener("click", () => {
    const items = Object.entries(borr.sel).map(([id,k]) => ({liqId:id, kg:r2(Number(k)||0)})).filter(i => i.kg > .009);
    if(!items.length) return aviso("Selecciona al menos una liquidación.");
    for(const i of items){
      const l = S.liquidaciones.find(x=>x.id===i.liqId);
      if(i.kg > saldo(l) + .009) return aviso(l.numero + " solo tiene " + nk(saldo(l)) + " kg de saldo.");
      i.costoUnit = l.valorUnit;
    }
    const total = num($("vnT").value);
    if(total <= 0) return aviso("Ingresa el precio de venta o el importe total.");
    let cid = $("vnC").value;
    if(cid === "__n" || !S.clientes.length){
      const nom = $("vnNom").value.trim();
      if(!nom) return aviso("Escribe la razón social del comprador.");
      cid = uid();
      S.clientes.push({id:cid, nombre:nom.toUpperCase(), doc:$("vnRuc").value.trim()});
    }
    const det = $("vnD").checked ? r2(total * S.cfg.detraccion/100) : 0;
    const v = {id:uid(), empresaId:EA(), numero:$("vnN").value.trim() || ((e.serieVen||"E001")+"-"+sq.ven),
               fecha:$("vnF").value || hoy(), clienteId:cid, items, total:r2(total),
               detraccion:det, netoCobrar:r2(total-det), pagos:[], factoringId:null, rev:null};
    S.ventas.push(v); sq.ven++;
    guardar(); pintar();
    flujo({titulo:"Venta " + v.numero + " registrada",
           detalle:nk(vKg(v)) + " kg · " + sol(v.total) + " · margen " + sol(vMargen(v)),
           pregunta:"¿Ya se cobró esta factura?", si:"Sí, ya la cobré", no:"No, queda pendiente",
           monto:v.netoCobrar, verbo:"cobro",
           alPagar:(m,f) => { v.pagos.push({fecha:f, medio:m, monto:v.netoCobrar}); guardar(); pintar(); }});
  });
}

function nuevoFactoring(){
  if(!EA()) return aviso("Primero registra una empresa.");
  const e = emp(EA()), sq = seqDe(EA());
  const cand = de("ventas").filter(v => !v.factoringId && estado(v,v.netoCobrar)==="pend")
                 .sort((a,b)=>(a.fecha+a.numero).localeCompare(b.fecha+b.numero));
  if(!cand.length){
    return hoja({titulo:"No hay facturas por ceder",
      cuerpo:'<div class="done"><div class="mk">' + ic("factor",22) + '</div>' +
        '<h4>Todas las facturas están cobradas</h4>' +
        '<p>Solo se pueden ceder facturas de venta de ' + esc(e.nombre) + ' que sigan pendientes de cobro.</p></div>',
      pie:'<button class="btn btn-sec btn-lg btn-full" data-x>Entendido</button>'});
  }
  borr = {sel:{}, modo:"lote"};

  hoja({
    titulo:"Operación de factoring", sub:e.nombre,
    cuerpo:'<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label for="fcN">N° operación</label><input id="fcN" value="FAC-' + sq.fac + '"></div>' +
        '<div class="field"><label for="fcF">Fecha</label><input id="fcF" type="date" value="' + hoy() + '"></div>' +
      '</div>' +
      '<div class="field"><label for="fcE">Empresa de factoring</label><select id="fcE">' +
        S.factores.map(f => '<option value="' + f.id + '">' + esc(f.nombre) + '</option>').join("") +
        '<option value="__n">+ Agregar empresa nueva…</option></select></div>' +
      '<div id="fcNv" class="grid2" style="display:' + (S.factores.length?"none":"grid") + '">' +
        '<div class="field"><label for="fcNom">Razón social</label><input id="fcNom" autocapitalize="characters"></div>' +
        '<div class="field"><label for="fcRuc">RUC</label><input id="fcRuc" inputmode="numeric"></div>' +
      '</div>' +
      '<hr class="hr">' +
      '<div class="sec-hd"><h2>Facturas que voy a ceder</h2></div>' +
      '<div class="pick" id="fcP"></div>' +
      '<hr class="hr">' +
      '<div class="sec-hd"><h2>Descuento del factor</h2></div>' +
      '<div class="filters">' +
        '<button data-md="lote" aria-pressed="true">Un % a todo el lote</button>' +
        '<button data-md="factura" aria-pressed="false">Un % por cada factura</button></div>' +
      '<div class="field" id="fcTw"><label for="fcT">Porcentaje de descuento</label>' +
        '<input id="fcT" inputmode="decimal" value="1.5"></div>' +
      '<div id="fcPf" class="stack" style="display:none"></div>' +
      '<div class="card card-p"><div class="dl" id="fcC"></div></div>' +
      '<p class="muted">Al registrar, estas facturas quedan <b>cobradas por factoring</b> y salen de cuentas por cobrar.</p>' +
    '</div>',
    pie:'<button class="btn btn-pri btn-lg btn-full" id="fcS">Registrar factoring</button>'
  });

  $("fcE").addEventListener("change", () => { $("fcNv").style.display = $("fcE").value==="__n" ? "grid" : "none"; });

  const fila = v => '<div class="pick-i' + (borr.sel[v.id]?" on":"") + '">' +
    '<button class="pick-h" data-p="' + v.id + '"><span class="box">' + ic("check",13) + '</span>' +
    '<span class="pick-m"><span class="pick-t">' + esc(v.numero) + '</span>' +
      '<span class="pick-s">' + esc(cat("clientes",v.clienteId).nombre) + '</span>' +
      '<span class="pick-q">' + sol(v.netoCobrar) + ' por cobrar · ' + fch(v.fecha) + '</span></span></button></div>';

  function enlazar(){
    $("fcP").querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.p;
      if(borr.sel[id]) delete borr.sel[id]; else borr.sel[id] = true;
      repintar();
    }));
  }
  function repintar(){ $("fcP").innerHTML = cand.map(fila).join(""); enlazar(); tasas(); calc(); }

  $sheet.querySelectorAll("[data-md]").forEach(b => b.addEventListener("click", () => {
    borr.modo = b.dataset.md;
    $sheet.querySelectorAll("[data-md]").forEach(x => x.setAttribute("aria-pressed", x.dataset.md===borr.modo));
    $("fcTw").style.display = borr.modo==="lote" ? "flex" : "none";
    $("fcPf").style.display = borr.modo==="lote" ? "none" : "flex";
    tasas(); calc();
  }));

  function tasas(){
    if(borr.modo !== "factura"){ $("fcPf").innerHTML = ""; return; }
    const ids = Object.keys(borr.sel);
    $("fcPf").innerHTML = ids.length ? ids.map(id => {
      const v = S.ventas.find(x=>x.id===id);
      return '<div class="field"><label for="t_' + id + '">' + esc(v.numero) + ' · ' + sol(v.netoCobrar) + '</label>' +
             '<input id="t_' + id + '" data-t="' + id + '" inputmode="decimal" value="' + (borr["t_"+id] ?? 1.5) + '"></div>';
    }).join("") : '<p class="muted">Selecciona facturas arriba para asignarles su porcentaje.</p>';
    $("fcPf").querySelectorAll("[data-t]").forEach(i =>
      i.addEventListener("input", () => { borr["t_"+i.dataset.t] = i.value; calc(); }));
  }

  function cuenta(){
    const ids = Object.keys(borr.sel), tl = num($("fcT").value);
    let bruto = 0, desc = 0;
    const det = ids.map(id => {
      const v = S.ventas.find(x=>x.id===id);
      const tasa = borr.modo==="lote" ? tl : num(borr["t_"+id] ?? 1.5);
      const d = r2(v.netoCobrar * tasa/100);
      bruto += v.netoCobrar; desc += d;
      return {ventaId:id, numero:v.numero, bruto:v.netoCobrar, tasa, descuento:d, neto:r2(v.netoCobrar-d)};
    });
    return {det, bruto:r2(bruto), descuento:r2(desc), neto:r2(bruto-desc)};
  }
  function calc(){
    const r = cuenta();
    $("fcC").innerHTML =
      '<div class="r"><span>Facturas cedidas</span><b>' + r.det.length + '</b></div>' +
      '<div class="r"><span>Valor bruto de las facturas</span><b>' + sol(r.bruto) + '</b></div>' +
      '<div class="r"><span>Descuento del factor</span><b class="v-dgr">− ' + n2(r.descuento) + '</b></div>' +
      '<div class="r tot"><span>Neto a recibir</span><b>' + sol(r.neto) + '</b></div>';
  }
  $("fcT").addEventListener("input", calc);
  repintar();

  $("fcS").addEventListener("click", () => {
    const r = cuenta();
    if(!r.det.length) return aviso("Selecciona al menos una factura.");
    let fid = $("fcE").value;
    if(fid === "__n" || !S.factores.length){
      const nom = $("fcNom").value.trim();
      if(!nom) return aviso("Escribe la razón social de la empresa de factoring.");
      fid = uid();
      S.factores.push({id:fid, nombre:nom.toUpperCase(), doc:$("fcRuc").value.trim()});
    }
    const f = {id:uid(), empresaId:EA(), numero:$("fcN").value.trim() || ("FAC-"+sq.fac),
               fecha:$("fcF").value || hoy(), factorId:fid, modo:borr.modo, tasa:num($("fcT").value),
               detalle:r.det, ventaIds:r.det.map(d=>d.ventaId),
               bruto:r.bruto, descuento:r.descuento, neto:r.neto, pagos:[], rev:null};
    S.factorings.push(f); sq.fac++;
    r.det.forEach(d => {
      const v = S.ventas.find(x => x.id===d.ventaId);
      v.factoringId = f.id;
      v.pagos.push({fecha:f.fecha, medio:"FACTORING", monto:v.netoCobrar, nota:f.numero});
    });
    guardar(); pintar();
    flujo({titulo:"Factoring " + f.numero + " registrado",
           detalle:r.det.length + " factura" + (r.det.length===1?"":"s") + " cedida" + (r.det.length===1?"":"s") + " · quedaron cobradas",
           pregunta:"¿Ya te depositaron el neto?", si:"Sí, ya lo recibí", no:"Todavía no",
           monto:f.neto, verbo:"cobro",
           alPagar:(m,fe) => { f.pagos.push({fecha:fe, medio:m, monto:f.neto}); guardar(); pintar(); }});
  });
}

/* ============================================================
   FORMULARIO · FLETE

function nuevoFlete(){
  if(!EA()) return aviso("Primero registra una empresa.");
  const e = emp(EA()), sq = seqDe(EA());
  borr = {sel:{}};
  const liqs = de("liquidaciones").slice().sort((a,b)=>(b.fecha+b.numero).localeCompare(a.fecha+a.numero)).slice(0,60);

  hoja({
    titulo:"Registrar flete", sub:e.nombre,
    cuerpo:'<div class="stack">' +
      '<div class="grid2">' +
        '<div class="field"><label for="flN">N° / referencia</label><input id="flN" value="FLE-' + sq.fle + '"></div>' +
        '<div class="field"><label for="flF">Fecha</label><input id="flF" type="date" value="' + hoy() + '"></div>' +
      '</div>' +
      '<div class="field"><label for="flT">Transportista</label><select id="flT">' +
        S.transportistas.map(t => '<option value="' + t.id + '">' + esc(t.nombre) + '</option>').join("") +
        '<option value="__n">+ Agregar transportista nuevo…</option></select></div>' +
      '<div id="flNv" class="grid2" style="display:' + (S.transportistas.length?"none":"grid") + '">' +
        '<div class="field"><label for="flNom">Razón social o nombre</label><input id="flNom" autocapitalize="characters"></div>' +
        '<div class="field"><label for="flRuc">RUC</label><input id="flRuc" inputmode="numeric"></div>' +
      '</div>' +
      '<hr class="hr">' +
      '<div class="grid2">' +
        '<div class="field"><label for="flKg">Cantidad enviada (kg)</label><input id="flKg" inputmode="decimal" placeholder="0" autocomplete="off"></div>' +
        '<div class="field"><label for="flM">Monto pagado S/</label><input id="flM" inputmode="decimal" placeholder="0.00" autocomplete="off"></div>' +
      '</div>' +
      (liqs.length ? '<hr class="hr"><div class="sec-hd"><h2>Liquidaciones que van en este flete</h2></div>' +
        '<p class="muted">Al marcarlas se suman sus kilos.</p><div class="pick" id="flP"></div>' : '') +
      '<div class="card card-p"><div class="dl" id="flC"></div></div>' +
    '</div>',
    pie:'<button class="btn btn-pri btn-lg btn-full" id="flS">Registrar flete</button>'
  });

  $("flT").addEventListener("change", () => { $("flNv").style.display = $("flT").value==="__n" ? "grid" : "none"; });

  const fila = l => '<div class="pick-i' + (borr.sel[l.id]?" on":"") + '">' +
    '<button class="pick-h" data-p="' + l.id + '"><span class="box">' + ic("check",13) + '</span>' +
    '<span class="pick-m"><span class="pick-t">' + esc(l.numero) + '</span>' +
      '<span class="pick-s">' + esc(cat("pescadores",l.pescadorId).nombre) + '</span>' +
      '<span class="pick-q">' + nk(l.kg) + ' kg · ' + fch(l.fecha) + '</span></span></button></div>';

  function enlazar(){
    if(!$("flP")) return;
    $("flP").querySelectorAll("[data-p]").forEach(b => b.addEventListener("click", () => {
      const id = b.dataset.p;
      if(borr.sel[id]) delete borr.sel[id]; else borr.sel[id] = true;
      $("flP").innerHTML = liqs.map(fila).join(""); enlazar();
      const s = r2(Object.keys(borr.sel).reduce((t,i) => t + ((S.liquidaciones.find(x=>x.id===i)||{}).kg||0), 0));
      if(s > 0) $("flKg").value = s;
      calc();
    }));
  }
  function calc(){
    const kg = num($("flKg").value), m = num($("flM").value);
    $("flC").innerHTML =
      '<div class="r"><span>Lotes en este flete</span><b>' + Object.keys(borr.sel).length + '</b></div>' +
      '<div class="r"><span>Kilos transportados</span><b>' + nk(kg) + ' kg</b></div>' +
      (kg>0 && m>0 ? '<div class="r"><span>Costo por kilo</span><b>' + sol(m/kg) + '</b></div>' : '') +
      '<div class="r tot"><span>Monto del flete</span><b>' + sol(m) + '</b></div>';
  }
  if($("flP")){ $("flP").innerHTML = liqs.map(fila).join(""); enlazar(); }
  ["flKg","flM"].forEach(id => $(id).addEventListener("input", calc));
  calc();

  $("flS").addEventListener("click", () => {
    const m = num($("flM").value);
    if(m <= 0) return aviso("Ingresa el monto del flete.");
    let tid = $("flT").value;
    if(tid === "__n" || !S.transportistas.length){
      const nom = $("flNom").value.trim();
      if(!nom) return aviso("Escribe el nombre del transportista.");
      tid = uid();
      S.transportistas.push({id:tid, nombre:nom.toUpperCase(), doc:$("flRuc").value.trim()});
    }
    const f = {id:uid(), empresaId:EA(), numero:$("flN").value.trim() || ("FLE-"+sq.fle),
               fecha:$("flF").value || hoy(), transportistaId:tid,
               kg:r2(num($("flKg").value)), monto:r2(m), liqIds:Object.keys(borr.sel), pagos:[], rev:null};
    S.fletes.push(f); sq.fle++;
    guardar(); pintar();
    flujo({titulo:"Flete " + f.numero + " registrado",
           detalle:nk(f.kg) + " kg · " + cat("transportistas",tid).nombre,
           pregunta:"¿El flete se acaba de pagar?", si:"Sí, ya lo pagué", no:"No, queda pendiente", monto:f.monto,
           alPagar:(md,fe) => { f.pagos.push({fecha:fe, medio:md, monto:f.monto}); guardar(); pintar(); }});
  });
}
/* ============================================================
   DETALLE DE UN MOVIMIENTO
   ============================================================ */
function abrir(ref){
  const [coll,id] = ref.split(":");
  ({liquidaciones:dLiq, ventas:dVenta, factorings:dFact, fletes:dFlete}[coll] || (()=>{}))(id);
}

function cabecera(d, chip, nombre, sub){
  const rv = REV[revOf(d)];
  return '<div class="card card-p">' +
    '<div class="rec-t" style="margin-bottom:8px">' + chip +
      '<span class="chip ' + rv.c + '"><i></i>' + rv.t + '</span>' +
      '<span class="chip c-neu">' + fch(d.fecha) + '</span></div>' +
    '<div style="font-weight:650">' + esc(nombre) + '</div>' +
    '<p class="muted">' + esc(sub) + '</p>' +
    '<div class="rec-t" style="margin-top:9px"><span class="codot" style="background:' + hue(d.empresaId) + '"></span>' +
      '<span class="muted">' + esc(emp(d.empresaId).nombre) + '</span></div>' +
    (d.rev && d.rev.nota ? '<p class="muted" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft)">' +
      '<b>Observación:</b> ' + esc(d.rev.nota) + '</p>' : '') +
  '</div>';
}
function pieDetalle(d, coll, ep, falta, verbo){
  return '<div class="btn-row">' +
    '<button class="btn btn-dgr btn-sm" style="flex:0 0 auto" data-del>' + ic("cerrar",14) + '</button>' +
    '<button class="btn btn-sec" data-rev>' + ic("check",15) + 'Revisión</button>' +
    (ep === "pend" ? '<button class="btn btn-pri" data-pay>' + (verbo==="cobro"?"Cobrar ":"Pagar ") + sol(falta) + '</button>'
                   : '<button class="btn btn-sec" data-x>Cerrar</button>') + '</div>';
}

function dLiq(id){
  const l = S.liquidaciones.find(x=>x.id===id); if(!l) return;
  const ep = estado(l,l.neto), sd = saldo(l), pg = pagado(l);
  const vts = S.ventas.filter(v => v.items.some(i => i.liqId===id));
  const p = cat("pescadores", l.pescadorId);
  hoja({
    titulo:"Liquidación " + l.numero,
    cuerpo:'<div class="stack-lg">' +
      cabecera(l, ep==="ok" ? '<span class="chip c-ok"><i></i>Pagada</span>' : '<span class="chip c-warn"><i></i>Por pagar</span>',
               p.nombre, "DNI " + (p.doc || "—")) +
      '<div class="card card-p"><div class="dl">' +
        '<div class="r"><span>Kilos comprados</span><b>' + nk(l.kg) + ' kg</b></div>' +
        '<div class="r"><span>Precio por kilo</span><b>S/ ' + n2(l.valorUnit) + '</b></div>' +
        '<div class="r"><span>Total valor de compra</span><b>' + sol(l.total) + '</b></div>' +
        '<div class="r"><span>Retención de IR ' + S.cfg.retencion + '%</span><b class="v-dgr">− ' + n2(l.retencion) + '</b></div>' +
        '<div class="r tot"><span>Neto a pagar</span><b>' + sol(l.neto) + '</b></div>' +
      '</div></div>' +
      '<div class="sec"><div class="sec-hd"><h2>Mercadería</h2></div><div class="card card-p">' +
        '<div class="dl">' +
          '<div class="r"><span>Comprado</span><b>' + nk(l.kg) + ' kg</b></div>' +
          '<div class="r"><span>Vendido</span><b>' + nk(l.kg-sd) + ' kg</b></div>' +
          '<div class="r tot"><span>Saldo disponible</span><b class="' + (sd>0?"v-acc":"") + '">' + nk(sd) + ' kg</b></div>' +
        '</div>' +
        '<div class="bar" style="margin-top:10px"><i style="width:' + (l.kg ? Math.min(100,(l.kg-sd)/l.kg*100) : 0) + '%"></i></div>' +
        (vts.length ? '<p class="muted" style="margin-top:10px">Vendida en ' + vts.map(v =>
          '<b>' + esc(v.numero) + '</b> (' + nk(v.items.filter(i=>i.liqId===id).reduce((t,i)=>t+i.kg,0)) + ' kg)').join(" · ") + '</p>' : '') +
      '</div></div>' +
      blqPagos(l, l.neto, "pago") +
    '</div>',
    pie:pieDetalle(l,"liquidaciones",ep,r2(l.neto-pg),"pago")
  });
  enlazarDetalle(l, "liquidaciones", r2(l.neto-pg), "pago", () => {
    if(vts.length) return aviso("No se puede: está vendida en " + vts.map(v=>v.numero).join(", ") + ".");
    confirmar("¿Eliminar esta liquidación?", l.numero + " · " + nk(l.kg) + " kg · " + sol(l.neto), () => {
      S.liquidaciones = S.liquidaciones.filter(x => x.id!==id);
      S.fletes.forEach(f => f.liqIds = f.liqIds.filter(x => x!==id));
      guardar(); pintar(); cerrar(); aviso("Liquidación eliminada.");
    });
  });
}

function dVenta(id){
  const v = S.ventas.find(x=>x.id===id); if(!v) return;
  const ep = estado(v,v.netoCobrar), pg = pagado(v), co = vCosto(v), mg = vMargen(v);
  const fc = v.factoringId ? S.factorings.find(f=>f.id===v.factoringId) : null;
  const c = cat("clientes", v.clienteId);
  hoja({
    titulo:"Venta " + v.numero,
    cuerpo:'<div class="stack-lg">' +
      cabecera(v, chipEstado(ep), c.nombre, "RUC " + (c.doc || "—")) +
      (fc ? '<p class="muted">Cedida en la operación <b>' + esc(fc.numero) + '</b> a ' + esc(cat("factores",fc.factorId).nombre) + '.</p>' : '') +
      '<div class="sec"><div class="sec-hd"><h2>Sustento de la venta</h2></div><div class="card card-p"><div class="dl">' +
        v.items.map(i => {
          const l = S.liquidaciones.find(x=>x.id===i.liqId);
          const parcial = l && i.kg < l.kg - .009;
          return '<div class="r"><span><b style="font-family:var(--mono);color:var(--ink)">' + esc(l?l.numero:"—") + '</b>' +
            '<small>' + esc(l?cat("pescadores",l.pescadorId).nombre:"") + (parcial ? " · parcial de " + nk(l.kg) + " kg" : "") + '</small></span>' +
            '<b>' + nk(i.kg) + ' kg<small style="font-weight:400;color:var(--ink-3)">' + sol(i.kg*i.costoUnit) + '</small></b></div>';
        }).join("") +
        '<div class="r tot"><span>Total</span><b>' + nk(vKg(v)) + ' kg</b></div>' +
      '</div></div></div>' +
      '<div class="card card-p"><div class="dl">' +
        '<div class="r"><span>Importe de la factura</span><b>' + sol(v.total) + '</b></div>' +
        '<div class="r"><span>Precio de venta por kilo</span><b>S/ ' + n2(v.total/(vKg(v)||1)) + '</b></div>' +
        (v.detraccion ? '<div class="r"><span>Detracción (Banco de la Nación)</span><b class="v-dgr">− ' + n2(v.detraccion) + '</b></div>' : '') +
        '<div class="r tot"><span>Neto a cobrar del cliente</span><b>' + sol(v.netoCobrar) + '</b></div>' +
        '<div class="r" style="margin-top:4px"><span>Costo de la mercadería</span><b>' + sol(co) + '</b></div>' +
        '<div class="r tot"><span>Margen bruto</span><b class="' + (mg>=0?"v-acc":"v-dgr") + '">' + sol(mg) + '</b></div>' +
      '</div></div>' +
      blqPagos(v, v.netoCobrar, "cobro") +
    '</div>',
    pie:pieDetalle(v,"ventas",ep,r2(v.netoCobrar-pg),"cobro")
  });
  enlazarDetalle(v, "ventas", r2(v.netoCobrar-pg), "cobro", () => {
    if(v.factoringId) return aviso("Primero elimina la operación de factoring que la incluye.");
    confirmar("¿Eliminar esta venta?", v.numero + " · " + sol(v.total) + ". Los kilos vuelven al saldo de sus liquidaciones.", () => {
      S.ventas = S.ventas.filter(x => x.id!==id);
      guardar(); pintar(); cerrar(); aviso("Venta eliminada. Saldos restituidos.");
    });
  });
}

function dFact(id){
  const f = S.factorings.find(x=>x.id===id); if(!f) return;
  const pg = pagado(f), ep = estado(f,f.neto);
  hoja({
    titulo:"Factoring " + f.numero,
    cuerpo:'<div class="stack-lg">' +
      cabecera(f, ep==="ok" ? '<span class="chip c-ok"><i></i>Neto recibido</span>' : '<span class="chip c-warn"><i></i>Neto pendiente</span>',
               cat("factores",f.factorId).nombre,
               f.modo==="lote" ? "Descuento único de " + f.tasa + "% sobre todo el lote" : "Descuento asignado factura por factura") +
      '<div class="sec"><div class="sec-hd"><h2>Facturas cedidas</h2></div><div class="card card-p"><div class="dl">' +
        f.detalle.map(d => '<div class="r"><span><b style="font-family:var(--mono);color:var(--ink)">' + esc(d.numero) + '</b>' +
          '<small>' + sol(d.bruto) + ' − ' + d.tasa + '%</small></span><b>' + sol(d.neto) + '</b></div>').join("") +
      '</div></div></div>' +
      '<div class="card card-p"><div class="dl">' +
        '<div class="r"><span>Valor bruto cedido</span><b>' + sol(f.bruto) + '</b></div>' +
        '<div class="r"><span>Descuento del factor</span><b class="v-dgr">− ' + n2(f.descuento) + '</b></div>' +
        '<div class="r tot"><span>Neto a recibir</span><b>' + sol(f.neto) + '</b></div>' +
      '</div></div>' +
      blqPagos(f, f.neto, "cobro") +
    '</div>',
    pie:pieDetalle(f,"factorings",ep,r2(f.neto-pg),"cobro")
  });
  enlazarDetalle(f, "factorings", r2(f.neto-pg), "cobro", () => {
    confirmar("¿Eliminar esta operación?", f.numero + ". Las " + f.ventaIds.length + " facturas vuelven a quedar por cobrar.", () => {
      f.ventaIds.forEach(vid => {
        const v = S.ventas.find(x=>x.id===vid);
        if(v){ v.factoringId = null; v.pagos = v.pagos.filter(p => !(p.medio==="FACTORING" && p.nota===f.numero)); }
      });
      S.factorings = S.factorings.filter(x => x.id!==id);
      guardar(); pintar(); cerrar(); aviso("Operación eliminada.");
    });
  });
}

function dFlete(id){
  const f = S.fletes.find(x=>x.id===id); if(!f) return;
  const ep = estado(f,f.monto), pg = pagado(f);
  hoja({
    titulo:"Flete " + f.numero,
    cuerpo:'<div class="stack-lg">' +
      cabecera(f, ep==="ok" ? '<span class="chip c-ok"><i></i>Pagado</span>' : '<span class="chip c-warn"><i></i>Por pagar</span>',
               cat("transportistas",f.transportistaId).nombre, nk(f.kg) + " kg transportados") +
      '<div class="card card-p"><div class="dl">' +
        '<div class="r"><span>Kilos transportados</span><b>' + nk(f.kg) + ' kg</b></div>' +
        (f.kg ? '<div class="r"><span>Costo por kilo</span><b>' + sol(f.monto/f.kg) + '</b></div>' : '') +
        '<div class="r tot"><span>Monto del flete</span><b>' + sol(f.monto) + '</b></div>' +
      '</div></div>' +
      (f.liqIds.length ? '<div class="sec"><div class="sec-hd"><h2>Liquidaciones transportadas</h2></div>' +
        '<div class="card card-p"><div class="dl">' + f.liqIds.map(li => {
          const l = S.liquidaciones.find(x=>x.id===li); if(!l) return "";
          return '<div class="r"><span><b style="font-family:var(--mono);color:var(--ink)">' + esc(l.numero) + '</b>' +
            '<small>' + esc(cat("pescadores",l.pescadorId).nombre) + '</small></span><b>' + nk(l.kg) + ' kg</b></div>';
        }).join("") + '</div></div></div>' : '') +
      blqPagos(f, f.monto, "pago") +
    '</div>',
    pie:pieDetalle(f,"fletes",ep,r2(f.monto-pg),"pago")
  });
  enlazarDetalle(f, "fletes", r2(f.monto-pg), "pago", () => {
    confirmar("¿Eliminar este flete?", f.numero + " · " + sol(f.monto), () => {
      S.fletes = S.fletes.filter(x => x.id!==id);
      guardar(); pintar(); cerrar(); aviso("Flete eliminado.");
    });
  });
}

function enlazarDetalle(d, coll, falta, verbo, alBorrar){
  const p = $sheet.querySelector("[data-pay]");
  if(p) p.addEventListener("click", () => pedirMedio({monto:falta, verbo, ok:(m,f) => {
    d.pagos.push({fecha:f, medio:m, monto:falta});
    guardar(); pintar(); cerrar();
    aviso((verbo==="cobro"?"Cobro":"Pago") + " registrado · " + medioN(m));
  }}));
  const r = $sheet.querySelector("[data-rev]");
  if(r) r.addEventListener("click", () => shRevisar(coll + ":" + d.id));
  const b = $sheet.querySelector("[data-del]");
  if(b) b.addEventListener("click", alBorrar);
}

  hoja({
    titulo: e ? "Editar empresa" : "Nueva empresa",

function bajar(nombre, texto, tipo){
  const blob = new Blob(["﻿" + texto], {type: tipo + ";charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  aviso("Archivo " + nombre + " generado.");
}
const celda = v => { const s = String(v==null?"":v); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
const aCSV = (c,f) => [c,...f].map(r => r.map(celda).join(";")).join("\r\n");
function aTXT(t,c,f){
  const w = c.map((x,i) => Math.max(String(x).length, ...f.map(r => String(r[i]==null?"":r[i]).length)));
  const ln = r => r.map((x,i) => String(x==null?"":x).padEnd(w[i])).join("  ");
  return [t, "Generado el " + fch(hoy()), "", ln(c), w.map(x => "-".repeat(x)).join("  "), ...f.map(ln)].join("\r\n");
}

function exportar(arg){

/* ============================================================
   COMBINAR RESPALDOS
   Mientras no haya nube, el respaldo es el puente entre el gerente
   y el contador. Reemplazar borraria el trabajo del otro, asi que
   se combina registro por registro.
   ============================================================ */
const clavePago = p => [p.fecha, p.medio, (p.monto||0).toFixed(2), p.nota||""].join("|");

function unirPagos(a, b){
  const out = (a||[]).slice(), vistos = new Set(out.map(clavePago));
  (b||[]).forEach(p => { const k = clavePago(p); if(!vistos.has(k)){ out.push(p); vistos.add(k); } });
  return out.sort((x,y) => String(x.fecha).localeCompare(String(y.fecha)));
}

/* Gana la revision mas reciente; una marca real gana sobre la ausencia. */
function mejorRev(a, b){
  if(!a) return b || null;
  if(!b) return a;
  return String(b.fecha||"") >= String(a.fecha||"") ? b : a;
}

function fusionar(local, entra){
  const out = JSON.parse(JSON.stringify(local));
  const r = {nuevos:0, actualizados:0, catalogos:0, empresas:0};

  ["empresas","pescadores","clientes","transportistas","factores"].forEach(k => {
    if(!Array.isArray(out[k])) out[k] = [];
    const idx = new Set(out[k].map(x => x.id));
    (entra[k]||[]).forEach(x => {
      if(idx.has(x.id)) return;
      out[k].push(x); idx.add(x.id);
      if(k === "empresas") r.empresas++; else r.catalogos++;
    });
  });

  ["liquidaciones","ventas","factorings","fletes"].forEach(k => {
    if(!Array.isArray(out[k])) out[k] = [];
    const idx = new Map(out[k].map(x => [x.id, x]));
    (entra[k]||[]).forEach(e => {
      const l = idx.get(e.id);
      if(!l){ out[k].push(e); idx.set(e.id, e); r.nuevos++; return; }
      const pagos = unirPagos(l.pagos, e.pagos);
      const rev   = mejorRev(l.rev, e.rev);
      Object.assign(l, e, {pagos, rev});
      r.actualizados++;
    });
  });

  out.seq = out.seq || {};
  Object.keys(entra.seq || {}).forEach(eid => {
    const a = out.seq[eid] || {liq:1, ven:1, fac:1, fle:1}, b = entra.seq[eid];
    out.seq[eid] = {liq:Math.max(a.liq||1, b.liq||1), ven:Math.max(a.ven||1, b.ven||1),
                    fac:Math.max(a.fac||1, b.fac||1), fle:Math.max(a.fle||1, b.fle||1)};
  });

  return {estado:out, r};
}

function leerRespaldo(file, alLeer){
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      if(!d || !Array.isArray(d.liquidaciones) || !Array.isArray(d.ventas)) throw 0;
      alLeer(d);
    }catch(e){ aviso("Ese archivo no es un respaldo válido."); }
  };
  rd.readAsText(file);
}
